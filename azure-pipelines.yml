# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- main
 
pool:
  vmImage: 'ubuntu-latest'
  # other options: 'macOS-latest', ' windows-latest

steps:
  # Use a task to install Java 17
- task: JavaToolInstaller@1
  displayName: Install Java
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64' 
    jdkSourceOption: 'PreInstalled'

 # Install Google Chrome (real .deb from Google, guarantees binary at /usr/bin/google-chrome)
- script: |
    set -e
    wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    sudo apt-get update
    sudo apt-get install -y /tmp/google-chrome.deb
    echo "Chrome installed at:"
    which google-chrome
    google-chrome --version
  displayName: 'Install Google Chrome'

  # Run Maven build and tests
- task: Maven@4
  displayName: Configuring maven project
  inputs:
      mavenPomFile: 'pom.xml'
      mavenOptions: '-Xmx3072m'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.17'
      jdkArchitectureOption: 'x64' 
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      goals: 'clean test'